name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Solution KaTeX / format check
        # Soft until the format_issues bank is cleaned; set STRICT_SOLUTIONS=1 to gate.
        run: npm run check:solutions
        env:
          STRICT_SOLUTIONS: "0"
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
